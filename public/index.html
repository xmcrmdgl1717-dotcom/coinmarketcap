<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Prices by Market Cap</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --text-primary: #0d1421;
            --text-secondary: #616e85;
            --bg-hover: #f8fafd;
            --border-color: #eff2f5;
            --up-color: #16c784;
            --down-color: #ea3943;
            --bg-card: #ffffff;
            --bg-inner: #f8fafd;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; background-color: #f8fafd; color: var(--text-primary); font-size: 14px;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* ================= 顶部卡片布局 ================= */
        .top-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        @media (max-width: 1024px) { .top-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .top-cards { grid-template-columns: 1fr; } }

        .card { background: var(--bg-card); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .card-title span { color: var(--text-secondary); font-weight: 400; font-size: 13px; cursor: pointer; }
        
        /* ================= 卡片1：Market Status ================= */
        .ms-grid { display: flex; gap: 12px; margin-bottom: 12px; }
        .ms-left { flex: 1; background: var(--bg-inner); border-radius: 8px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ms-right { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .ms-right .inner-card { background: var(--bg-inner); border-radius: 8px; padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        /* 仪表盘简易样式 */
        .gauge { width: 80px; height: 40px; border-top-left-radius: 80px; border-top-right-radius: 80px; background: conic-gradient(from 270deg at 50% 100%, #ea3943 0%, #f3d42f 40%, #16c784 80%, transparent 80%); margin-bottom: 8px; position: relative; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 4px;}
        .gauge::after { content: ''; position: absolute; width: 60px; height: 30px; background: var(--bg-inner); bottom: 0; left: 10px; border-top-left-radius: 60px; border-top-right-radius: 60px; }
        .gauge-value { position: relative; z-index: 1; font-weight: 700; font-size: 16px; margin-bottom: 2px;}
        .gauge-label { font-size: 11px; background: #f0b90b; color: #fff; padding: 2px 8px; border-radius: 10px; font-weight: 600; z-index: 1; }

        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px;}
        .stat-label { color: var(--text-secondary); }
        .stat-value { font-weight: 600; }
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }

        /* 进度条和 ETF 小图 */
        .ms-bottom { display: flex; gap: 12px; }
        .ms-bottom .inner-card { flex: 1; background: var(--bg-inner); border-radius: 8px; padding: 12px; }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 8px; display: flex; overflow: hidden; }
        .progress-seg { height: 100%; }

        /* ================= 卡片2 & 3：列表与图表 ================= */
        .trend-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; }
        .trend-left { display: flex; align-items: center; gap: 8px; }
        .trend-left img { width: 20px; height: 20px; border-radius: 50%; }
        
        .mini-chart { height: 40px; background: var(--bg-inner); margin-bottom: 12px; border-radius: 8px; position: relative; display: flex; align-items: flex-end; padding: 0 10px; gap: 4px; overflow: hidden;}
        .bar { flex: 1; border-radius: 2px 2px 0 0; }
        
        /* ================= 表格区域 ================= */
        .table-wrapper { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { color: var(--text-secondary); font-weight: 500; font-size: 12px; padding: 16px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; background: #fff; }
        th:nth-child(1), th:nth-child(2), td:nth-child(1), td:nth-child(2) { text-align: left; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        tbody tr:hover { background-color: var(--bg-hover); }
        .coin-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .coin-info img { width: 24px; height: 24px; border-radius: 50%; }
        .coin-name { font-weight: 600; }
        .coin-symbol { color: var(--text-secondary); font-size: 12px; margin-left: 4px; }
        .sparkline { width: 100px; height: 30px; object-fit: contain; }
        
        .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 20px; padding-bottom: 40px; }
        button { padding: 8px 16px; border: 1px solid #cfd6e4; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-primary); }
        button:disabled { color: #ccc; cursor: not-allowed; border-color: var(--border-color); }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-cards">
            <!-- Market Status -->
            <div class="card">
                <div class="card-title">Market Status <span>查看全部 ></span></div>
                <div class="ms-grid">
                    <div class="ms-left">
                        <div class="gauge"></div>
                        <div class="gauge-value" id="fg-value">--</div>
                        <div class="gauge-label" id="fg-label">Neutral</div>
                    </div>
                    <div class="ms-right">
                        <div class="inner-card">
                            <div class="stat-row"><span class="stat-label">Market Cap</span><span class="stat-value" id="global-mcap">--</span></div>
                        </div>
                        <div class="inner-card">
                            <div class="stat-row"><span class="stat-label">CMC20</span><span class="stat-value">$163.14 <span class="text-up">▲ 1.77%</span></span></div>
                        </div>
                    </div>
                </div>
                <div class="ms-bottom">
                    <div class="inner-card">
                        <div class="stat-row"><span class="stat-label">Altcoin Season</span><span class="stat-value">48</span></div>
                        <div class="progress-bar">
                            <div class="progress-seg" style="width:25%; background:#f0b90b;"></div>
                            <div class="progress-seg" style="width:25%; background:#cfd6e4;"></div>
                            <div class="progress-seg" style="width:25%; background:#3b82f6;"></div>
                            <div class="progress-seg" style="width:25%; background:#16c784;"></div>
                        </div>
                    </div>
                    <div class="inner-card">
                        <div class="stat-row"><span class="stat-label">ETF Flows</span><span class="stat-value text-up">+ $148.10M</span></div>
                    </div>
                </div>
            </div>

            <!-- Trending Coins (加入轮播指示器 ID) -->
            <div class="card">
                <div class="card-title">Trending Coins <span id="trending-page-indicator">1/5 ></span></div>
                <div id="trending-list"></div>
            </div>

            <!-- Derivatives -->
            <div class="card">
                <div class="card-title">Derivatives <span>详情 ></span></div>
                <div id="derivatives-content">
                    <!-- 占位 -->
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>1h %</th>
                        <th>24h %</th>
                        <th>7d %</th>
                        <th>Market Cap</th>
                        <th>Volume(24h)</th>
                        <th>Circulating Supply</th>
                        <th>7d Price%</th>
                    </tr>
                </thead>
                <tbody id="crypto-tbody">
                    <tr><td colspan="10" style="text-align: center; padding: 50px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="page-info" style="color: var(--text-secondary);">Page 1</span>
            <button id="btn-prev" disabled>Previous</button>
            <button id="btn-next">Next</button>
        </div>
    </div>
    <script src="/inject.js"></script>
</body>
</html>
