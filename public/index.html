<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Markets</title>
    <style>
        /* 基础变量与样式，完美复刻原版的高级感 */
        :root {
            --text-primary: #0d1421;
            --text-secondary: #616e85;
            --bg-hover: #f8fafd;
            --border-color: #eff2f5;
            --up-color: #16c784;
            --down-color: #ea3943;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            background: #fff;
            font-size: 14px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        /* 前两列靠左对齐 */
        th:nth-child(1), th:nth-child(2), td:nth-child(1), td:nth-child(2) {
            text-align: left;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        tbody tr:hover {
            background-color: var(--bg-hover);
        }
        /* 币种信息 */
        .coin-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .coin-info img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .coin-symbol {
            color: var(--text-secondary);
            font-size: 12px;
        }
        /* 涨跌颜色 */
        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        
        .sparkline {
            width: 100px;
            height: 30px;
            object-fit: contain;
        }
        /* 翻页控件 */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding-bottom: 40px;
        }
        button {
            padding: 6px 12px;
            border: 1px solid #cfd6e4;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
        }
        button:disabled {
            color: #ccc;
            cursor: not-allowed;
            border-color: var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>1h %</th>
                        <th>24h %</th>
                        <th>7d %</th>
                        <th>Market Cap</th>
                        <th>Volume(24h)</th>
                        <th>Circulating Supply</th>
                        <th>7d Price%</th>
                    </tr>
                </thead>
                <tbody id="crypto-tbody">
                    <tr><td colspan="10" style="text-align: center; padding: 50px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination">
            <span id="page-info" style="color: var(--text-secondary); margin-right: 10px;"></span>
            <button id="btn-prev" disabled>Previous</button>
            <button id="btn-next">Next</button>
        </div>
    </div>
    <script src="/inject.js"></script>
</body>
</html>
