<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Prices by Market Cap</title>
    <style>
        :root {
            --text-primary: #0d1421;
            --text-secondary: #616e85;
            --bg-hover: #f8fafd;
            --border-color: #eff2f5;
            --up-color: #16c784;
            --down-color: #ea3943;
            --bg-card: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; background-color: #f8fafd; color: var(--text-primary); font-size: 14px;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .top-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .card-title span { color: var(--text-secondary); font-weight: 400; font-size: 12px; }
        .card-content { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; }
        .stat-label { color: var(--text-secondary); }
        .stat-value { font-weight: 600; }
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
        .table-wrapper { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { color: var(--text-secondary); font-weight: 500; font-size: 12px; padding: 16px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; background: #fff; }
        th:nth-child(1), th:nth-child(2), td:nth-child(1), td:nth-child(2) { text-align: left; }
        td { padding: 16px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        tbody tr:hover { background-color: var(--bg-hover); }
        .coin-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .coin-info img { width: 24px; height: 24px; border-radius: 50%; }
        .coin-name { font-weight: 600; }
        .coin-symbol { color: var(--text-secondary); font-size: 12px; }
        .sparkline { width: 100px; height: 30px; object-fit: contain; }
        .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 20px; padding-bottom: 40px; }
        button { padding: 8px 16px; border: 1px solid #cfd6e4; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-primary); }
        button:disabled { color: #ccc; cursor: not-allowed; border-color: var(--border-color); }
        #page-info { color: var(--text-secondary); font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-cards">
            <div class="card">
                <div class="card-title">Market Status <span>查看全部 ></span></div>
                <div class="card-content"></div>
            </div>
            <div class="card">
                <div class="card-title">Trending Coins <span>1/5 ></span></div>
                <div class="card-content"></div>
            </div>
            <div class="card">
                <div class="card-title">Derivatives <span>详情 ></span></div>
                <div class="card-content"></div>
            </div>
            <div class="card">
                <div class="card-title">Community <span>进入 ></span></div>
                <div class="card-content">
                    <!-- 静态展示占位，因为帖子接口收费较高，通常用静态数据 -->
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                        <img src="https://s3.coinmarketcap.com/static-gravity/image/f4513c9b490e4dfb9c5ac561f63b95f4.png" style="width: 24px; height: 24px; border-radius: 50%;" />
                        <div><strong>@TheCrypto_B</strong> <span style="color: var(--text-secondary); font-size: 12px;">· 7h · Bullish</span></div>
                    </div>
                    <div style="font-size: 13px; line-height: 1.4;">$BTC is back above $80,000 after a nervous election night in the US...</div>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>1h %</th>
                        <th>24h %</th>
                        <th>7d %</th>
                        <th>Market Cap</th>
                        <th>Volume(24h)</th>
                        <th>Circulating Supply</th>
                        <th>7d Price%</th>
                    </tr>
                </thead>
                <tbody id="crypto-tbody">
                    <tr><td colspan="10" style="text-align: center; padding: 50px;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="page-info">Page 1</span>
            <button id="btn-prev" disabled>Previous</button>
            <button id="btn-next">Next</button>
        </div>
    </div>
    <script src="/inject.js"></script>
</body>
</html>
